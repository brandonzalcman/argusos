name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runIntegration:
        description: Run Docker-backed integration suites (currently TODO-only)
        type: boolean
        default: false
      runE2E:
        description: Run Playwright suites (currently skipped)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Strict checks, build, and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Biome lint
        run: pnpm lint
      - name: Biome formatting
        run: pnpm format:check
      - name: Strict workspace typecheck
        run: pnpm typecheck
      - name: Strict cross-project test typecheck
        run: pnpm exec tsc --noEmit --project tests/tsconfig.json
      - name: Build packages and applications
        run: pnpm build
      - name: Unit tests
        run: pnpm test
      - name: Validate Playwright discovery without a browser
        run: pnpm exec playwright test --config tests/e2e/playwright.config.ts --list

  infrastructure:
    name: Compose, Helm, and load-script validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Guard against :latest tags and literal credentials in deploy manifests
        run: bash .github/scripts/check-deploy-guards.sh
      - name: Validate Compose model
        run: >-
          docker compose
          --env-file deploy/compose/.env.example
          --file deploy/compose/docker-compose.yaml
          config --quiet
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.19.5
      - name: Lint Helm chart with explicit external placeholders
        run: helm lint deploy/helm/argus --values deploy/helm/argus/values.example.yaml
      - name: Render Helm chart
        run: >-
          helm template argus deploy/helm/argus
          --namespace argus-system
          --values deploy/helm/argus/values.example.yaml
      - name: Lint and render Helm chart with production values template
        run: |
          helm lint deploy/helm/argus --values deploy/helm/argus/values.production.example.yaml
          helm template argus deploy/helm/argus --namespace argus-system --values deploy/helm/argus/values.production.example.yaml > /dev/null
      - name: Helm must refuse production without image digests
        run: |
          if helm template argus deploy/helm/argus --namespace argus-system --values deploy/helm/argus/values.example.yaml --set production=true > /dev/null 2>&1; then
            echo "::error::production=true rendered without image digests"
            exit 1
          fi
      - uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1.3.0
      - name: Validate k6 script without executing network load
        run: k6 inspect tests/performance/realtime.k6.js

  integration:
    name: Optional Docker-backed integration tests
    if: github.event_name == 'workflow_dispatch' && inputs.runIntegration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm Testcontainers runtime
        run: docker info
      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: Optional Playwright tests
    if: github.event_name == 'workflow_dispatch' && inputs.runE2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Playwright tests against an already running deployment
        env:
          ARGUS_E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm test:e2e
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
