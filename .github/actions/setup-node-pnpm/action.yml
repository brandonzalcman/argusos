name: Setup Node and pnpm
description: Install the repository Node and pnpm toolchain with a pnpm store cache.
runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        run_install: false
    - name: Setup Node 26
      uses: actions/setup-node@v4
      with:
        node-version: 26
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
