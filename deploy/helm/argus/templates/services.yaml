{{- $root := . -}}
{{- range $name, $workload := .Values.workloads }}
{{- if $workload.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" $root }}-{{ $name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "argus.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: {{ $workload.service.type }}
  selector:
    {{- include "argus.selectorLabels" (dict "root" $root "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $workload.service.port }}
      targetPort: http
      protocol: TCP
---
{{- end }}
{{- end }}
