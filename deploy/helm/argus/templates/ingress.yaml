{{- if .Values.ingress.enabled }}
{{- $root := . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "argus.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: {{ .paths.api }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "argus.fullname" $root }}-api
                port:
                  name: http
          - path: {{ .paths.realtime }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "argus.fullname" $root }}-realtime
                port:
                  name: http
          - path: {{ .paths.web }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "argus.fullname" $root }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
