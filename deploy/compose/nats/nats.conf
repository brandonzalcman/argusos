# Local development only. Per-user credentials and least-privilege subject
# permissions replace the former unauthenticated listener. Passwords come from the
# container environment ($VAR is NATS config env substitution), set from
# deploy/compose/.env.
#
# Subject layout is a placeholder until the realtime architecture fixes it:
#   argus.<tenantId>.<incidentId>.<kind>   (kind: incident-events|alerts|presence|workflows|feeds)
# TODO(decision): confirm this layout against apps/realtime/src/events/subjects.ts
# when buildNatsSubject is implemented.
# TODO(verify): start the pinned nats image and exercise each user's allow/deny.
#
# Production equivalent (Helm): the chart does not install NATS. Use an operator-
# managed cluster with TLS and either (a) one NATS user/NKey per workload with the
# same permission sets as below, supplied through that workload's own Secret
# (`NATS_URL` key, see deploy/README.md), or (b) JWT/decentralised auth with an
# account per deployment and per-tenant user JWTs minted by the API. Never share
# one credential between api, realtime and worker.
server_name: argus-development
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: "/data"
  max_mem: 256M
  max_file: 1G
}

authorization {
  users = [
    {
      # API: publishes domain events, manages streams/consumers.
      user: argus_api
      password: $NATS_API_PASSWORD
      permissions: {
        publish: { allow: ["argus.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      # Realtime gateway: reads scoped subjects, publishes only presence.
      # It must not publish to incident-events/alerts and has no stream admin.
      user: argus_realtime
      password: $NATS_REALTIME_PASSWORD
      permissions: {
        publish: {
          allow: [
            "argus.*.*.presence",
            "$JS.API.CONSUMER.CREATE.>",
            "$JS.API.CONSUMER.INFO.>",
            "$JS.API.CONSUMER.MSG.NEXT.>",
            "$JS.API.STREAM.INFO.>",
            "$JS.ACK.>"
          ]
        }
        subscribe: { allow: ["argus.>", "_INBOX.>"] }
      }
    }
    {
      # Worker: consumes workflow/feed subjects, publishes results and alerts.
      user: argus_worker
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: { allow: ["argus.>", "$JS.API.>", "$JS.ACK.>"] }
        subscribe: { allow: ["argus.>", "_INBOX.>"] }
      }
    }
  ]
}

# TODO(implementation): define durable streams, retention, deduplication windows,
# consumer policies, and per-tenant/incident subject ACLs (dynamic, minted
# credentials) in the realtime architecture.
