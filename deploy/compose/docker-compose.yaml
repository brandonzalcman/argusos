name: argusos-development

# Local development dependencies. Applications run on the host (`pnpm dev`) by
# default; the optional `apps` profile builds the application images (scaffold
# only: their entry points and health endpoints are not implemented).
# Credentials come from deploy/compose/.env (copy .env.example) via ${VAR:?}.
# TODO(verify): smoke-test the pinned images and mounted configuration with Docker.
x-local-restart: &local-restart
  restart: unless-stopped

services:
  postgres:
    <<: *local-restart
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the local-only PostgreSQL admin password}
      # Consumed by postgres/init/01-roles.sh on first initialisation only.
      ARGUS_MIGRATOR_PASSWORD: ${ARGUS_MIGRATOR_PASSWORD:?Set the local-only migrator role password}
      ARGUS_RUNTIME_PASSWORD: ${ARGUS_RUNTIME_PASSWORD:?Set the local-only runtime role password}
      ARGUS_ELECTRIC_PASSWORD: ${ARGUS_ELECTRIC_PASSWORD:?Set the local-only Electric role password}
      ARGUS_REPORTING_PASSWORD: ${ARGUS_REPORTING_PASSWORD:?Set the local-only reporting role password}
      ARGUS_MARTIN_PASSWORD: ${ARGUS_MARTIN_PASSWORD:?Set the local-only Martin role password}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=8
      - -c
      - max_wal_senders=12
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus_admin -d argus"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [argus-development]

  electric:
    <<: *local-restart
    image: electricsql/electric:1.8.1
    environment:
      DATABASE_URL: postgresql://argus_electric:${ARGUS_ELECTRIC_PASSWORD:?Set the local-only Electric role password}@postgres:5432/argus?sslmode=disable
      ELECTRIC_SECRET: ${ELECTRIC_SECRET:?Set the local-only Electric secret}
      ELECTRIC_PORT: 3000
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [argus-development]

  nats:
    <<: *local-restart
    image: nats:2.15.3-alpine
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_API_PASSWORD: ${NATS_API_PASSWORD:?Set the local-only NATS api user password}
      NATS_REALTIME_PASSWORD: ${NATS_REALTIME_PASSWORD:?Set the local-only NATS realtime user password}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:?Set the local-only NATS worker user password}
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats-data:/data
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [argus-development]

  garage:
    <<: *local-restart
    image: dxflrs/garage:v2.5.0
    entrypoint: ["/garage"]
    command: ["server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?Set the local-only Garage access key ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?Set the local-only Garage secret key}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET:-argus-local}
    ports:
      - "127.0.0.1:9000:3900"
    volumes:
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - ./garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      # The official scratch image contains /garage but deliberately has no shell,
      # curl or wget. The CLI checks the local node's RPC health without them.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [argus-development]

  martin:
    <<: *local-restart
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/etc/martin/config.yaml"]
    environment:
      DATABASE_URL: postgresql://argus_martin:${ARGUS_MARTIN_PASSWORD:?Set the local-only Martin role password}@postgres:5432/argus?sslmode=disable
    ports:
      - "127.0.0.1:3004:3000"
    volumes:
      - ./martin/config.yaml:/etc/martin/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks: [argus-development]

  otel-collector:
    <<: *local-restart
    image: otel/opentelemetry-collector-contrib:0.165.0
    profiles: [observability]
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      loki:
        condition: service_started
      tempo:
        condition: service_started
    # No HTTP probe: the pinned official image is scratch-based and has no shell,
    # curl or wget. Dependents use service_started, not a fictitious health probe.
    networks: [argus-development]

  prometheus:
    <<: *local-restart
    image: prom/prometheus:v3.16.0
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [argus-development]

  loki:
    <<: *local-restart
    image: grafana/loki:3.7.10
    profiles: [observability]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki-data:/loki
      - ./observability/loki.yaml:/etc/loki/config.yaml:ro
    # No HTTP probe: the pinned official distroless image has no shell/curl/wget.
    networks: [argus-development]

  tempo:
    <<: *local-restart
    image: grafana/tempo:3.1.1
    profiles: [observability]
    command: ["-config.file=/etc/tempo/config.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
    volumes:
      - tempo-data:/var/tempo
      - ./observability/tempo.yaml:/etc/tempo/config.yaml:ro
    # No HTTP probe: the pinned official distroless image has no shell/curl/wget.
    networks: [argus-development]

  grafana:
    <<: *local-restart
    image: grafana/grafana:13.3.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: argus_admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set the local-only Grafana password}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3300:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/argus.yaml:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [argus-development]

  # ---- Optional application images (profile "apps"; scaffold only) ----
  # `docker compose --profile apps up -d --build`. Not part of the default
  # dependency stack and unverified: entry points/health endpoints are stubs.
  api:
    <<: *local-restart
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: argusos-api:local
    environment:
      ARGUS_ENV: local
      DATABASE_URL: postgresql://argus:${ARGUS_RUNTIME_PASSWORD:?Set the local-only runtime role password}@postgres:5432/argus?sslmode=disable
      NATS_URL: nats://argus_api:${NATS_API_PASSWORD:?Set the local-only NATS api user password}@nats:4222
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-argus-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the local-only Garage access key ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the local-only Garage secret key}
      S3_FORCE_PATH_STYLE: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set the local-only auth secret}
      BETTER_AUTH_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [argus-development]

  realtime:
    <<: *local-restart
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/realtime/Dockerfile
    image: argusos-realtime:local
    environment:
      ARGUS_ENV: local
      DATABASE_URL: postgresql://argus:${ARGUS_RUNTIME_PASSWORD:?Set the local-only runtime role password}@postgres:5432/argus?sslmode=disable
      NATS_URL: nats://argus_realtime:${NATS_REALTIME_PASSWORD:?Set the local-only NATS realtime user password}@nats:4222
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [argus-development]

  worker:
    <<: *local-restart
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: argusos-worker:local
    environment:
      ARGUS_ENV: local
      DATABASE_URL: postgresql://argus:${ARGUS_RUNTIME_PASSWORD:?Set the local-only runtime role password}@postgres:5432/argus?sslmode=disable
      NATS_URL: nats://argus_worker:${NATS_WORKER_PASSWORD:?Set the local-only NATS worker user password}@nats:4222
      S3_ENDPOINT: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-argus-local}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set the local-only Garage access key ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set the local-only Garage secret key}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [argus-development]

  web:
    <<: *local-restart
    profiles: [apps]
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: argusos-web:local
    ports:
      - "127.0.0.1:3000:3000"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [argus-development]

volumes:
  postgres-data:
  nats-data:
  garage-meta:
  garage-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:

networks:
  argus-development:
    name: argus-development
    driver: bridge
