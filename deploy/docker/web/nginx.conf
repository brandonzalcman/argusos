# Minimal static-site server for the ArgusOS web image (unprivileged, port 3000).
# Every writable path lives in /tmp so readOnlyRootFilesystem works in Kubernetes.
# TODO(verify): validate with `nginx -t` inside the built image.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  server_tokens off;
  sendfile on;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 3000;
    root /usr/share/nginx/html;

    # TODO(decision): tighten CSP once the API/realtime/Electric/tile origins are
    # fixed; connect-src must list them explicitly.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed build assets are immutable.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      try_files $uri =404;
    }

    # Single-page-app fallback; never cache the HTML shell.
    location / {
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
      try_files $uri /index.html;
    }
  }
}
