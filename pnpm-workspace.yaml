# pnpm 12 fails closed on dependency lifecycle scripts. esbuild needs its
# postinstall validation for the docs toolchain. The remaining scripts are
# optional/native accelerators or install-time notices; review before allowing.
allowBuilds:
  esbuild: true
  core-js: false
  cpu-features: false
  protobufjs: false
  ssh2: false

# Dependency-provided agent skills are not trusted or installed automatically.
skills:
  dirs: []

